# ============================================================================
# Deploy Backend to Cloud Run
# ============================================================================
# Triggered when a GitHub Release is published.
# Builds the game-server Docker image, pushes it to Artifact Registry,
# and deploys it to Cloud Run.
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID  – Google Cloud project ID (e.g. "my-project-123")
#   GCP_SA_KEY      – Service account JSON key with the following roles:
#                       • Cloud Run Admin
#                       • Storage Admin
#                       • Artifact Registry Writer
# ============================================================================

name: Deploy Backend to Cloud Run

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  REGION: europe-west1
  SERVICE_NAME: trut-game-server
  IMAGE_BASE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trut/game-server

jobs:
  deploy:
    name: Build & Deploy game-server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using a service account JSON key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.IMAGE_BASE }}:${{ github.event.release.tag_name }}" \
            -t "${{ env.IMAGE_BASE }}:latest" \
            -f Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_BASE }}:${{ github.event.release.tag_name }}"
          docker push "${{ env.IMAGE_BASE }}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.IMAGE_BASE }}:${{ github.event.release.tag_name }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --quiet
